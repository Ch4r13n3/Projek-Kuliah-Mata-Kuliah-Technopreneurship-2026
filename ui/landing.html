<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - GlowDiary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            title: '#5c5296',     /* Warna ungu gelap untuk judul */
                            subtitle: '#988aef',  /* Warna ungu terang untuk subtitle */
                            card: '#f4e6f1',      /* Warna pink pucat untuk kotak form */
                            button: '#7781ca',    /* Warna biru-ungu untuk tombol */
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            /* Gradasi background persis seperti gambar */
            background: linear-gradient(180deg, #fdf6fb 0%, #e2cae7 50%, #d8b8df 100%);
            min-height: 100vh;
        }
        .custom-shadow {
            /* Shadow khusus untuk kotak form agar terlihat sedikit mengambang */
            box-shadow: 6px 6px 15px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body class="flex flex-col justify-center items-center px-6 font-sans text-gray-800 antialiased overflow-x-hidden">

    <div class="text-center mb-6 mt-10">
        <h1 class="text-[32px] md:text-4xl font-extrabold text-brand-title tracking-tight mb-1">Create Account</h1>
        <p class="text-brand-subtitle font-medium text-sm md:text-base">Start your skin journey here</p>
    </div>

    <div class="w-full max-w-sm bg-brand-card p-8 rounded-[2rem] custom-shadow mb-8 relative z-10">
        <form action="kuesioner.html" class="space-y-5">
            
            <div class="flex flex-col gap-1.5">
                <label for="username" class="text-sm font-medium text-gray-800 ml-1">Username</label>
                <input type="text" id="username" required
                    class="w-full bg-transparent border border-gray-600 rounded-full px-4 py-2 focus:outline-none focus:border-brand-title focus:ring-1 focus:ring-brand-title transition-colors">
            </div>

            <div class="flex flex-col gap-1.5">
                <label for="email" class="text-sm font-medium text-gray-800 ml-1">Email</label>
                <input type="email" id="email" required
                    class="w-full bg-transparent border border-gray-600 rounded-full px-4 py-2 focus:outline-none focus:border-brand-title focus:ring-1 focus:ring-brand-title transition-colors">
            </div>

            <div class="flex flex-col gap-1.5">
                <label for="password" class="text-sm font-medium text-gray-800 ml-1">Password</label>
                <input type="password" id="password" required
                    class="w-full bg-transparent border border-gray-600 rounded-full px-4 py-2 focus:outline-none focus:border-brand-title focus:ring-1 focus:ring-brand-title transition-colors">
            </div>

        </form>
    </div>

    <button onclick="window.location.href='kuesioner.html'" 
        class="w-full max-w-[280px] bg-brand-button hover:bg-[#6872b8] text-white font-semibold rounded-full py-3.5 mb-6 shadow-md transition-all active:scale-95">
        Sign Up
    </button>

    <p class="text-gray-600 text-sm font-medium">
        Already have an account? 
        <a href="glowdiary.html" class="text-brand-title font-bold hover:underline">Login</a>
    </p>

</body>
</html>
